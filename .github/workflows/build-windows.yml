name: Build Windows VST3

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target AIMaster_VST3 --parallel

      - name: Package
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Recurse -Directory -Filter "AI Master.vst3" |
                 Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $vst) { throw "VST3 bundle not found" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse $vst.FullName "dist/AI Master.vst3"
          Compress-Archive -Path "dist/AI Master.vst3" -DestinationPath "dist/AI-Master-VST3-Windows.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Master-VST3-Windows
          path: dist/AI Master.vst3

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AI-Master-VST3-Windows.zip
